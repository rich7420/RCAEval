# Task 6 數據收集系統配置示例
# 用於配置數據收集的各種參數和選項

# 服務連接配置
services:
  prometheus:
    url: "http://localhost:9090"
    timeout: 30
  loki:
    url: "http://localhost:3100" 
    timeout: 30
  jaeger:
    url: "http://localhost:16686"
    timeout: 30

# 數據收集配置
collection:
  # 時間範圍設置
  time_range:
    default_duration_minutes: 10
    max_duration_hours: 24
    
  # 服務過濾 (留空表示收集所有服務)
  services_filter: []
  # 示例: ["frontend", "backend", "database"]
  
  # 並行收集設置
  parallel:
    enabled: true
    max_workers: 3
    timeout_minutes: 5

# Metrics 收集配置
metrics:
  # 是否啟用聚合
  aggregate: true
  aggregation_window: "1min"
  aggregation_functions: ["mean", "max", "p95"]
  
  # 採樣設置
  sample: false
  sample_rate: 0.1
  sampling_strategy: "uniform"  # uniform, stratified, adaptive
  
  # 異常值處理
  remove_outliers: true
  outlier_threshold: 1.5
  outlier_method: "iqr"  # iqr, zscore
  
  # 自定義 PromQL 查詢
  custom_queries:
    http_requests_rate: 'rate(http_requests_total[1m])'
    error_rate: 'rate(http_requests_total{status=~"5.."}[1m])'
    response_time_p99: 'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[1m]))'

# Logs 收集配置  
logs:
  # 是否提取日誌模板
  extract_templates: true
  
  # 日誌聚類配置
  clustering:
    method: "drain"  # drain, tfidf, edit_distance
    min_cluster_size: 3
    similarity_threshold: 0.8
    
  # 日誌級別過濾
  level_filter: []  # 留空表示收集所有級別
  # 示例: ["ERROR", "WARN", "INFO"]
  
  # 相關性分析
  correlation:
    enabled: true
    time_window_seconds: 60

# Traces 收集配置
traces:
  # 是否分析依賴關係
  analyze_dependencies: true
  
  # 性能分析
  performance_analysis:
    enabled: true
    slow_trace_percentile: 0.95
    anomaly_detection_threshold: 2.0
    
  # 錯誤分析
  error_analysis:
    enabled: true
    include_http_errors: true
    
  # 關鍵路徑分析
  critical_path_analysis:
    enabled: true
    max_paths: 10

# 數據處理配置
processing:
  # 數據質量分析
  quality_analysis:
    enabled: true
    completeness_threshold: 0.8
    
  # 跨數據源相關性分析
  cross_correlation:
    enabled: true
    time_tolerance_seconds: 30
    
  # 異常檢測
  anomaly_detection:
    enabled: true
    methods: ["zscore", "iqr"]
    
# 數據導出配置
export:
  # 輸出格式
  formats: ["csv", "json"]
  
  # 輸出目錄
  output_directory: "./output"
  
  # 文件命名
  filename_template: "{experiment_name}_{data_type}_{timestamp}"
  
  # cluster_info.json 配置
  cluster_info:
    enabled: true
    include_examples: true
    max_examples_per_template: 5
    
  # 數據壓縮
  compression:
    enabled: false
    format: "gzip"

# 日誌配置
logging:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null  # 設置文件路徑以啟用文件日誌

# 測試配置
testing:
  # 連接性測試
  connectivity_timeout: 10
  
  # 數據收集測試
  test_duration_minutes: 2
  min_expected_records:
    metrics: 10
    logs: 1
    traces: 1
    
  # 測試輸出
  test_output_directory: "./test_output"
  generate_test_report: true