# Minimal OpenTelemetry Demo - Core Services Only
# This includes only the essential services that are working properly

services:
  # Frontend Service
  frontend:
    image: ghcr.io/open-telemetry/demo:1.10.0-frontend
    container_name: frontend
    environment:
      - PORT=8080
      - FRONTEND_ADDR=0.0.0.0:8080
      - AD_SERVICE_ADDR=adservice:9555
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=frontend
      - OTEL_RESOURCE_ATTRIBUTES=service.name=frontend,service.version=1.10.0
    ports:
      - "8080:8080"
    depends_on:
      - adservice
      - productcatalogservice
      - recommendationservice
      - shippingservice
      - emailservice
      - paymentservice
    networks:
      - observability

  # Ad Service
  adservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-adservice
    container_name: adservice
    environment:
      - PORT=9555
      - AD_SERVICE_PORT=9555
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=adservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=adservice,service.version=1.10.0
    ports:
      - "9555:9555"
    networks:
      - observability

  # Email Service
  emailservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-emailservice
    container_name: emailservice
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=emailservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=emailservice,service.version=1.10.0
    ports:
      - "8081:8080"
    networks:
      - observability

  # Payment Service
  paymentservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-paymentservice
    container_name: paymentservice
    environment:
      - PORT=50051
      - PAYMENT_SERVICE_PORT=50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=paymentservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=paymentservice,service.version=1.10.0
    ports:
      - "50053:50051"
    networks:
      - observability

  # Product Catalog Service
  productcatalogservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-productcatalogservice
    container_name: productcatalogservice
    environment:
      - PORT=3550
      - PRODUCT_CATALOG_SERVICE_PORT=3550
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=productcatalogservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=productcatalogservice,service.version=1.10.0
    ports:
      - "3550:3550"
    networks:
      - observability

  # Recommendation Service
  recommendationservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-recommendationservice
    container_name: recommendationservice
    environment:
      - PORT=8080
      - RECOMMENDATION_SERVICE_PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=recommendationservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=recommendationservice,service.version=1.10.0
    ports:
      - "8082:8080"
    depends_on:
      - productcatalogservice
    networks:
      - observability

  # Shipping Service
  shippingservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-shippingservice
    container_name: shippingservice
    environment:
      - PORT=50051
      - SHIPPING_SERVICE_PORT=50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=shippingservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=shippingservice,service.version=1.10.0
    ports:
      - "50052:50051"
    networks:
      - observability

  # Load Generator
  loadgenerator:
    image: ghcr.io/open-telemetry/demo:1.10.0-loadgenerator
    container_name: loadgenerator
    environment:
      - FRONTEND_ADDR=frontend:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=loadgenerator
      - OTEL_RESOURCE_ATTRIBUTES=service.name=loadgenerator,service.version=1.10.0
    depends_on:
      - frontend
    networks:
      - observability

networks:
  observability:
    external: true
    name: observability-env_observability