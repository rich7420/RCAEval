    - OTEL_EXPORTER_OTLP_INSECURE=true
    - OTEL_SERVICE_NAME=featureflagservice
    - OTEL_RESOURCE_ATTRIBUTES=service.name=featureflagservice,service.version=1.0.0,deployment.environment=development
  ports:
    - "8081:8081"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
    interval: 30s
