# OpenTelemetry Demo Application Configuration
# This file contains environment variables and service configurations for the OTel Demo

# Global OpenTelemetry Configuration
otelcol:
  endpoint: "otel-collector:4317"
  insecure: true

# Service-specific configurations
services:
  # Frontend Service
  frontend:
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=frontend
      - OTEL_RESOURCE_ATTRIBUTES=service.name=frontend,service.version=1.0.0,deployment.environment=development
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cart Service
  cartservice:
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=cartservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=cartservice,service.version=1.0.0,deployment.environment=development
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:7070"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Checkout Service
  checkoutservice:
    env:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
