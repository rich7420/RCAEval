# Service Mesh Configuration for OpenTelemetry Demo
# This configuration defines service discovery, networking, and communication patterns

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-service-mesh
data:
  # Service Discovery Configuration
  services:
    frontend:
      port: 8080
      protocol: http
      health_check: "/health"
      dependencies:
        - cartservice
        - checkoutservice
        - currencyservice
        - productcatalogservice
        - recommendationservice
        - adservice
        - shippingservice
      
    cartservice:
      port: 7070
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies:
        - redis
      
    checkoutservice:
      port: 5050
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies:
        - cartservice
        - currencyservice
        - emailservice
        - paymentservice
        - productcatalogservice
        - shippingservice
      
    currencyservice:
      port: 7000
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    emailservice:
      port: 8080
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    paymentservice:
      port: 50051
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    productcatalogservice:
      port: 3550
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    recommendationservice:
      port: 8080
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies:
        - productcatalogservice
      
    shippingservice:
      port: 50051
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    adservice:
      port: 9555
      protocol: grpc
      health_check: "grpc_health_probe"
      dependencies: []
      
    featureflagservice:
      port: 8081
      protocol: http
      health_check: "/health"
      dependencies: []

  # Network Policies
  network_policies:
    # Allow all internal communication within observability network
    internal_communication:
      enabled: true
      network: "observability"
      
    # External access points
    external_access:
      - service: frontend
        port: 8080
        description: "Main application frontend"
      - service: featureflagservice
        port: 8081
        description: "Feature flag management"
      - service: loadgenerator
        port: 8089
        description: "Load generator web UI"

  # Load Balancing Configuration
  load_balancing:
    strategy: "round_robin"
    health_check_interval: "30s"
    timeout: "10s"
    retries: 3

  # Circuit Breaker Configuration
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: "30s"
    half_open_max_calls: 3

  # Rate Limiting
  rate_limiting:
    requests_per_second: 100
    burst_size: 200