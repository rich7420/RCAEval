[default]
# Default admin user
admin_user = admin
admin_password = admin

[server]
# Server settings
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
serve_from_sub_path = false

[database]
# Database settings (using SQLite for simplicity)
type = sqlite3
path = grafana.db

[session]
# Session settings
provider = file
provider_config = sessions

[security]
# Security settings
admin_user = admin
admin_password = admin
secret_key = SW2YcwTIb9zpOOhoPsMm
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax

[users]
# User settings
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth]
# Authentication settings
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
# Anonymous access
enabled = false

[log]
# Logging settings
mode = console
level = info

[metrics]
# Metrics settings
enabled = true
interval_seconds = 10

[alerting]
# Alerting settings (using unified alerting)
# enabled = true  # Removed - use unified_alerting instead

[explore]
# Explore settings
enabled = true

[help]
# Help settings
enabled = true

[profiles]
# Profiling settings
enabled = false

[feature_toggles]
# Feature toggles
enable = traceqlEditor

[unified_alerting]
# Unified alerting
enabled = true
ha_peers = ""
ha_listen_address = "0.0.0.0:9094"
ha_advertise_address = ""

[plugins]
# Plugin settings
enable_alpha = true
app_tls_skip_verify_insecure = false