# OpenTelemetry Demo Application Services
# Complete microservices from https://github.com/open-telemetry/opentelemetry-demo
# Fixed configuration for all services

services:
  # Frontend Service
  frontend:
    image: ghcr.io/open-telemetry/demo:1.10.0-frontend
    container_name: frontend
    environment:
      - PORT=8080
      - FRONTEND_ADDR=0.0.0.0:8080
      - AD_SERVICE_ADDR=adservice:9555
      - CART_SERVICE_ADDR=cartservice:7070
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=frontend
      - OTEL_RESOURCE_ATTRIBUTES=service.name=frontend,service.version=1.10.0
    ports:
      - "8080:8080"
    depends_on:
      - adservice
      - cartservice
      - checkoutservice
      - currencyservice
      - productcatalogservice
      - recommendationservice
      - shippingservice
    networks:
      - observability

  # Ad Service
  adservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-adservice
    container_name: adservice
    environment:
      - PORT=9555
      - AD_SERVICE_PORT=9555
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=adservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=adservice,service.version=1.10.0
    ports:
      - "9555:9555"
    networks:
      - observability

  # Cart Service
  cartservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-cartservice
    container_name: cartservice
    environment:
      - PORT=7070
      - CART_SERVICE_PORT=7070
      - REDIS_ADDR=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=cartservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=cartservice,service.version=1.10.0
    ports:
      - "7070:7070"
    depends_on:
      - redis
    networks:
      - observability
    restart: on-failure

  # Checkout Service
  checkoutservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-checkoutservice
    container_name: checkoutservice
    environment:
      - PORT=5050
      - CART_SERVICE_ADDR=cartservice:7070
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - EMAIL_SERVICE_ADDR=emailservice:8080
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=checkoutservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=checkoutservice,service.version=1.10.0
      - GOGC=100
    ports:
      - "5050:5050"
    depends_on:
      - cartservice
      - currencyservice
      - emailservice
      - paymentservice
      - productcatalogservice
      - shippingservice
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Currency Service
  currencyservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-currencyservice
    container_name: currencyservice
    environment:
      - PORT=7000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=currencyservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=currencyservice,service.version=1.10.0
    ports:
      - "7001:7000"
    networks:
      - observability
    platform: linux/amd64
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Email Service
  emailservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-emailservice
    container_name: emailservice
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=emailservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=emailservice,service.version=1.10.0
    ports:
      - "8081:8080"
    networks:
      - observability

  # Payment Service
  paymentservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-paymentservice
    container_name: paymentservice
    environment:
      - PORT=50051
      - PAYMENT_SERVICE_PORT=50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=paymentservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=paymentservice,service.version=1.10.0
    ports:
      - "50053:50051"  # 改端口避免衝突
    networks:
      - observability

  # Product Catalog Service
  productcatalogservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-productcatalogservice
    container_name: productcatalogservice
    environment:
      - PORT=3550
      - PRODUCT_CATALOG_SERVICE_PORT=3550
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=productcatalogservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=productcatalogservice,service.version=1.10.0
    ports:
      - "3550:3550"
    networks:
      - observability

  # Recommendation Service
  recommendationservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-recommendationservice
    container_name: recommendationservice
    environment:
      - PORT=8080
      - RECOMMENDATION_SERVICE_PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=recommendationservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=recommendationservice,service.version=1.10.0
    ports:
      - "8082:8080"
    depends_on:
      - productcatalogservice
    networks:
      - observability

  # Shipping Service
  shippingservice:
    image: ghcr.io/open-telemetry/demo:1.10.0-shippingservice
    container_name: shippingservice
    environment:
      - PORT=50051
      - SHIPPING_SERVICE_PORT=50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=shippingservice
      - OTEL_RESOURCE_ATTRIBUTES=service.name=shippingservice,service.version=1.10.0
    ports:
      - "50052:50051"
    networks:
      - observability

  # Redis for Cart Service
  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - observability

  # Load Generator
  loadgenerator:
    image: ghcr.io/open-telemetry/demo:1.10.0-loadgenerator
    container_name: loadgenerator
    environment:
      - FRONTEND_ADDR=frontend:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=loadgenerator
      - OTEL_RESOURCE_ATTRIBUTES=service.name=loadgenerator,service.version=1.10.0
    depends_on:
      - frontend
    networks:
      - observability

networks:
  observability:
    external: true
    name: observability-env_observability